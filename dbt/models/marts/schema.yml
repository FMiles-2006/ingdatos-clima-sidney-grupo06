version: 2

models:
  - name: fct_clima_mensual
    description: >
      Resumen del clima de Sídney por mes. Responde: ¿cómo fue cada mes (temperatura,
      lluvia, viento) y cuánto se apartó del promedio de ese mismo mes en 2022-2025?
      Se publica en PostgreSQL y alimenta el tablero de Metabase.
    columns:
      - name: mes
        description: "Primer día del mes resumido (ej. 2026-03-01 = marzo de 2026)."
        data_tests: [not_null, unique]
      - name: anio
        description: "Año del mes resumido."
      - name: mes_numero
        description: "Número del mes (1 = enero ... 12 = diciembre)."
      - name: estacion
        description: "Estación del hemisferio sur a la que pertenece el mes."
      - name: dias_con_datos
        description: "Días del mes que tienen datos. Menor que dias_del_mes en el mes en curso."
      - name: dias_del_mes
        description: "Días que tiene el mes en el calendario."
      - name: mes_completo
        description: "Verdadero si el mes tiene todos sus días. Los meses incompletos no deben compararse en totales (lluvia, días)."
      - name: temperatura_media_c
        description: "Temperatura media del mes, en °C (promedio de las temperaturas medias diarias)."
        data_tests: [not_null]
      - name: maxima_promedio_c
        description: "Promedio de las temperaturas máximas diarias, en °C: qué tan cálidas fueron las tardes."
      - name: minima_promedio_c
        description: "Promedio de las temperaturas mínimas diarias, en °C: qué tan frescas fueron las noches."
      - name: maxima_absoluta_c
        description: "Temperatura más alta registrada en el mes, en °C."
      - name: minima_absoluta_c
        description: "Temperatura más baja registrada en el mes, en °C."
      - name: anomalia_temperatura_c
        description: "Cuántos °C más cálido (+) o más frío (-) fue el mes respecto del promedio de ese mismo mes en 2022-2025."
      - name: lluvia_total_mm
        description: "Milímetros de lluvia acumulados en el mes."
        data_tests:
          - valor_en_rango: {arguments: {minimo: 0, maximo: 1500}}
      - name: lluvia_referencia_mm
        description: "Lluvia promedio de ese mismo mes en 2022-2025, en mm: el valor 'normal' contra el cual comparar."
      - name: dias_con_lluvia
        description: "Cantidad de días del mes con 1 mm de lluvia o más."
      - name: dias_de_calor_30c
        description: "Cantidad de días del mes con máxima de 30 °C o más."
      - name: dias_con_tormenta
        description: "Días cuyo estado del tiempo predominante fue tormenta eléctrica. Ojo: ERA5 (antes de 2026) no codifica tormentas, así que antes de 2026 siempre es 0."
      - name: rafaga_maxima_kmh
        description: "Ráfaga de viento más fuerte del mes, en km/h."
      - name: radiacion_solar_media_mj_m2
        description: "Energía solar diaria promedio del mes, en MJ/m²: indica meses más o menos soleados."
      - name: fase_enso
        description: >
          Fase de El Niño-Oscilación del Sur vigente el día 15 del mes según la Oficina de Meteorología
          de Australia: 'La Niña' (en el este de Australia suele traer más lluvia y días más frescos),
          'El Niño' (suele traer menos lluvia y más calor) o 'Neutral'. 'Sin clasificar' si el mes
          queda fuera del catálogo seeds/fases_enso.csv (hay que actualizarlo).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['La Niña', 'Neutral', 'El Niño', 'Sin clasificar']
      - name: fuente_del_dato
        description: "Origen de los datos del mes: 'ERA5 (reanálisis)' para 2022-2025, 'Historical Forecast (modelo)' desde 2026."

  - name: feat_clima_diario
    description: >
      Tabla de features: variables derivadas por día, definidas una sola vez y versionadas.
      Cada fila describe lo que se sabe al cierre del día `fecha` (para predecir el día
      siguiente). Ninguna columna usa información posterior a `fecha`.
    columns:
      - name: fecha
        description: "Día al que corresponde el vector de features (información disponible al cierre de ese día)."
        data_tests: [not_null, unique]
      - name: temp_media_c
        description: "Temperatura media del día, en °C (valor base, no derivado)."
      - name: lluvia_mm
        description: "Lluvia caída en el día, en mm (valor base, no derivado). Permite comparar la lluvia acumulada entre años para el mismo tramo de días."
        data_tests:
          - not_null
          - valor_en_rango: {arguments: {minimo: 0, maximo: 500}}
      - name: temp_media_movil_7d_c
        description: "Promedio de la temperatura media de los últimos 7 días calendario, incluido el día."
        data_tests:
          - not_null
          - valor_en_rango: {arguments: {minimo: -5, maximo: 50}}
      - name: temp_media_movil_30d_c
        description: "Promedio de la temperatura media de los últimos 30 días calendario, incluido el día."
      - name: lluvia_acumulada_7d_mm
        description: "Lluvia total de los últimos 7 días, en mm."
        data_tests:
          - valor_en_rango: {arguments: {minimo: 0, maximo: 1000}}
      - name: lluvia_acumulada_30d_mm
        description: "Lluvia total de los últimos 30 días, en mm."
      - name: dias_en_ventana_7d
        description: "Cuántos días con datos hay en la ventana de 7 días (7 = completa). Menor al inicio de la serie."
        data_tests:
          - valor_en_rango: {arguments: {minimo: 1, maximo: 7}}
      - name: variacion_temp_vs_dia_anterior_c
        description: "Cambio de la temperatura media respecto del día anterior, en °C (+ = se calentó)."
      - name: amplitud_termica_c
        description: "Diferencia entre máxima y mínima del día, en °C."
      - name: desvio_vs_media_30d_c
        description: "Cuánto se aparta la temperatura media del día de su promedio de los últimos 30 días, en °C."
      - name: dias_desde_ultima_lluvia
        description: "Días transcurridos desde el último día con 1 mm o más de lluvia (0 = llovió hoy). Nulo si todavía no llovió en la serie."
      - name: fuente
        description: "Origen del dato del día (archive_era5 / historical_forecast)."

  # ---------------------------------------------------------------------------
  # Agregados para el tablero (GOLD): Metabase solo los lee y los grafica.
  # El cálculo vive acá, versionado y con tests, no en las preguntas de Metabase.
  # ---------------------------------------------------------------------------
  - name: agg_estacion_lluvia
    description: >
      Una fila por estación. ¿Cambia la temperatura cuando llueve? Compara días con lluvia
      (>= 1 mm) y días secos: temperatura media y amplitud térmica (máxima − mínima).
    columns:
      - name: orden_estacion
        description: "Orden para graficar: 1 = Verano ... 4 = Primavera."
      - name: estacion
        description: "Estación del hemisferio sur."
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['Verano', 'Otoño', 'Invierno', 'Primavera']
      - name: temp_media_dia_seco_c
        description: "Temperatura media promedio de los días secos de la estación, en °C."
        data_tests: [not_null]
      - name: temp_media_dia_con_lluvia_c
        description: "Temperatura media promedio de los días con lluvia de la estación, en °C."
        data_tests: [not_null]
      - name: temp_media_estacion_c
        description: "Temperatura media promedio de todos los días de la estación, en °C."
      - name: amplitud_dia_seco_c
        description: "Diferencia promedio entre máxima y mínima en días secos, en °C."
      - name: amplitud_dia_con_lluvia_c
        description: "Diferencia promedio entre máxima y mínima en días con lluvia, en °C."
      - name: dias_secos
        description: "Cantidad de días secos usados en el promedio."
      - name: dias_con_lluvia
        description: "Cantidad de días con lluvia usados en el promedio."

  - name: agg_dias_sin_lluvia
    description: >
      Una fila por cantidad de días desde la última lluvia (0 = llovió ese día; 7 agrupa 7 o más).
      ¿Las rachas secas traen días más extremos y más cálidos que su media reciente?
    columns:
      - name: dias_sin_lluvia
        description: "Días desde la última lluvia (0 a 7; 7 = siete o más)."
        data_tests: [not_null, unique]
      - name: dias_sin_lluvia_etiqueta
        description: "La misma cantidad como texto para el eje del gráfico ('7 o más')."
      - name: amplitud_media_c
        description: "Diferencia promedio entre máxima y mínima del día, en °C."
      - name: temp_vs_media_30d_c
        description: "Cuánto más cálido (+) o más fresco (−) que su promedio de 30 días fue el día, en °C."
      - name: dias
        description: "Días que caen en ese grupo."

  - name: agg_anio_a_la_fecha
    description: >
      Una fila por año, siempre en el mismo tramo: del 1/1 al día y mes del último dato cargado.
      ¿Este año viene más cálido o más lluvioso que los anteriores? Se recalcula en cada corrida.
    columns:
      - name: anio
        description: "Año."
        data_tests: [not_null, unique]
      - name: tramo_hasta
        description: "Último día (dd/mm) del tramo comparado, igual para todos los años."
      - name: dias
        description: "Días con datos del año dentro del tramo."
      - name: temp_media_tramo_c
        description: "Temperatura media del año en el tramo, en °C."
        data_tests: [not_null]
      - name: anomalia_temperatura_c
        description: >
          Temperatura del tramo menos el promedio 2022-2025 del mismo tramo, en °C (+ = más cálido).
          Queda vacía solo si no hay ningún año de referencia en el tramo (por ejemplo, la muestra corta del CI).
      - name: lluvia_tramo_mm
        description: "Lluvia total del año en el tramo, en mm."

  - name: agg_fase_enso
    description: >
      Una fila por fase de El Niño / La Niña. En los meses de cada fase, ¿cuánto se apartaron
      la temperatura y la lluvia de lo habitual para ese mes? Solo meses completos y clasificados.
    columns:
      - name: orden_fase
        description: "Orden para graficar: 1 = La Niña, 2 = Neutral, 3 = El Niño."
      - name: fase_enso
        description: "Fase de El Niño-Oscilación del Sur."
        data_tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values: ['La Niña', 'Neutral', 'El Niño']
      - name: meses
        description: "Meses completos de esa fase en la serie."
      - name: anomalia_temperatura_c
        description: "Promedio de la anomalía de temperatura de esos meses, en °C."
      - name: lluvia_vs_normal_pct
        description: "Lluvia de esos meses frente a su promedio 2022-2025, en % (+ = más lluvioso)."
