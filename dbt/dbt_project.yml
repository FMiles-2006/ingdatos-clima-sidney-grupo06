name: 'clima_sidney'
version: '1.0.0'
config-version: 2
profile: 'clima_sidney'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  clima_sidney:
    # staging = capa SILVER (limpieza, tipos, nombres consistentes; un registro por día)
    # marts   = capa GOLD (modelos finales de consumo: hechos mensuales y features)
    staging:
      # Staging como TABLA (no vista), a contramano de la regla general del curso.
      # Motivo: bronze entra a DuckDB por el plugin 'delta' (lee la tabla Delta con la
      # librería deltalake al momento del build). Una vista sobre esa fuente quedaría
      # apuntando a algo que no existe fuera de la sesión de dbt, y publicar_gold.py /
      # los notebooks no podrían leerla. Son ~1.800 filas: materializarla cuesta nada.
      +materialized: table
    marts:
      +materialized: table

seeds:
  clima_sidney:
    +column_types:
      codigo_wmo: integer
